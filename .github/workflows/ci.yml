# CI for Home Net Explorer: validate → test → build → package.
#
# Constitution II: a change is done only when this workflow is green.
# Nothing is built locally; this workflow is the only toolchain (no local Go/Docker).
#
# On pull requests, `autofix` runs `go mod tidy`, `gofmt -w` and (when the OUI table is
# missing) `go generate ./internal/oui`, commits the result to the PR branch, and every later
# job checks out that commit, so one run validates the fixed tree. On `main`, nothing is
# rewritten and `make lint` enforces formatting strictly.
#
# The `detect` job turns jobs on as the matching tasks land:
#   contract lint    → always (specs/*/contracts/*.yaml)
#   go lint          → Makefile (T002)
#   tests            → go.mod (unit), tests/contract, tests/integration
#   binaries         → cmd/hne-server + cmd/hne-collector (T001)
#   container image  → deploy/Dockerfile + deploy/smoke.sh (T047)
# Hardware tests (-tags hwtest) need real NICs and run only on the NAS/desktop (T096).

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CGO_ENABLED: "0"
  GOFLAGS: -mod=readonly
  GOTESTSUM: gotest.tools/gotestsum@v1.13.0

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      make: ${{ steps.f.outputs.make }}
      suites: ${{ steps.f.outputs.suites }}
      cmd: ${{ steps.f.outputs.cmd }}
      image: ${{ steps.f.outputs.image }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: f
        run: |
          has() { [ -n "$(git ls-files -- "$@")" ]; }
          flag() { if "$@"; then echo true; else echo false; fi; }
          echo "make=$(flag has Makefile)" >> "$GITHUB_OUTPUT"
          echo "cmd=$(flag has cmd/hne-server/main.go cmd/hne-collector/main.go)" >> "$GITHUB_OUTPUT"
          echo "image=$(flag has deploy/Dockerfile)" >> "$GITHUB_OUTPUT"
          s='[]'
          add() { s=$(echo "$s" | jq -c --arg n "$1" --arg p "$2" '. + [{name: $n, pkgs: $p}]'); }
          has go.mod && add unit './internal/... ./cmd/... ./tools/...'
          has 'tests/contract/*_test.go' && add contract './tests/contract/...'
          has 'tests/integration/*_test.go' && add integration './tests/integration/...'
          echo "suites=$s" >> "$GITHUB_OUTPUT"
          echo "suites: $s"
      # App version (T099): the git tag for releases, else <VERSION major.minor>.<run number>,
      # so every build gets a higher version with nothing to bump by hand.
      - id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(tr -d '[:space:]' < VERSION 2>/dev/null || echo 0.0).$GITHUB_RUN_NUMBER"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "version: $v"

  autofix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    env:
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - id: go
        run: echo "present=$([ -f go.mod ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.go.outputs.present == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - if: steps.go.outputs.present == 'true'
        run: go mod tidy
      - if: steps.go.outputs.present == 'true'
        run: |
          files=$(git ls-files '*.go')
          if [ -n "$files" ]; then gofmt -w $files; fi
      - if: steps.go.outputs.present == 'true' && hashFiles('internal/oui/doc.go') != '' && hashFiles('internal/oui/oui.tsv.gz') == ''
        run: go generate ./internal/oui
      - id: push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to fix"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: autofix (go mod tidy, gofmt, go generate)"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  contract-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npx --yes @redocly/cli@2 lint --extends=minimal specs/*/contracts/*.yaml

  lint:
    needs: [detect, autofix]
    if: ${{ !cancelled() && needs.detect.outputs.make == 'true' && needs.autofix.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.autofix.outputs.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make lint   # gofmt, go vet, no subnet literals outside internal/contract/private.go (T002)

  test:
    needs: [detect, autofix]
    if: ${{ !cancelled() && needs.detect.outputs.suites != '[]' && needs.autofix.result != 'failure' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.suites) }}
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.autofix.outputs.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # -short skips the SC-007 perf test on shared runners.
      - run: go run $GOTESTSUM --junitfile report.xml --format testname -- -short -coverprofile=coverage.out ${{ matrix.pkgs }}
      - if: always()
        run: |
          echo "### ${{ matrix.name }} coverage" >> "$GITHUB_STEP_SUMMARY"
          [ -f coverage.out ] && go tool cover -func=coverage.out | tail -n 1 >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.name }}
          path: report.xml
          if-no-files-found: ignore

  # The desktop collector runs on Windows: run its packages there too, not just cross-compile.
  test-windows:
    needs: [detect, autofix]
    if: ${{ !cancelled() && needs.detect.outputs.cmd == 'true' && needs.autofix.result != 'failure' }}
    runs-on: windows-latest
    name: test (windows collector)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.autofix.outputs.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -short ./internal/collect/... ./internal/upload/... ./internal/contract/... ./cmd/hne-collector/...

  build:
    needs: [detect, autofix, lint, test, test-windows]
    if: ${{ !cancelled() && needs.detect.outputs.cmd == 'true' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { bin: hne-server, goos: linux, goarch: amd64 }
          - { bin: hne-server, goos: linux, goarch: arm64 }
          - { bin: hne-collector, goos: windows, goarch: amd64 }
          - { bin: hne-collector, goos: linux, goarch: amd64 }
          - { bin: hne-collector, goos: linux, goarch: arm64 }
    name: build (${{ matrix.bin }} ${{ matrix.goos }}/${{ matrix.goarch }})
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.autofix.outputs.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: |
          if [ "$GOOS" = windows ]; then EXT=.exe; else EXT=; fi
          COMMIT="${{ needs.autofix.outputs.sha || github.sha }}" # the commit actually built (not the PR merge ref)
          go build -trimpath -ldflags "-s -w -X main.version=${{ needs.detect.outputs.version }} -X main.commit=${COMMIT::7}" \
            -o "dist/${{ matrix.bin }}-${GOOS}-${GOARCH}${EXT}" "./cmd/${{ matrix.bin }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.bin }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  # Multi-arch server image → ghcr.io, then a smoke test on a fresh volume.
  # Pull requests build without pushing. The Dockerfile cross-compiles via $BUILDPLATFORM
  # (no QEMU needed), and deploy/smoke.sh is POSIX sh honouring HNE_IMAGE / HNE_SMOKE_HOST (T047).
  image:
    needs: [detect, autofix, test]
    if: ${{ !cancelled() && needs.detect.outputs.image == 'true' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.autofix.outputs.sha || github.sha }}
      # BuildKit and the Go base image come from mirror.gcr.io: Docker Hub's auth endpoint
      # failed (429/504) on the runners and blocked every image build.
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=${{ needs.detect.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.detect.outputs.version }}
            COMMIT=${{ needs.autofix.outputs.sha || github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: hne-server:smoke
          build-args: |
            VERSION=${{ needs.detect.outputs.version }}
            COMMIT=${{ needs.autofix.outputs.sha || github.sha }}
          cache-from: type=gha
      - run: HNE_IMAGE=hne-server:smoke HNE_EXPECT_VERSION=${{ needs.detect.outputs.version }} sh deploy/smoke.sh
