# Home Net Explorer on the NAS (quickstart.md §3). deploy.ps1 uploads this file as
# docker-compose.yml, creates ./data (owned by the image user 65532) and writes HNE_PORT to .env.
# No subnet settings: the server discovers the subnets it is attached to.
services:
  hne-server:
    image: ghcr.io/atotmakov/home_net_explorer:latest
    container_name: home-net-explorer
    # Host networking puts the container on the real LAN, so it can send ARP requests.
    # (There is no port mapping; the UI listens on HNE_PORT directly on the NAS.)
    network_mode: host
    cap_add: [NET_RAW]
    volumes:
      # Database and history. Back up this folder (or use the UI's export).
      - ./data:/data
    environment:
      HNE_LISTEN: ":${HNE_PORT:-8080}"
      # HNE_SCAN_INTERVAL: "900s"   # default built-in scan interval (also editable in Settings)
      # HNE_DNS_SERVER: ""          # optional private DNS server for hostnames; default: the gateway
    restart: unless-stopped
